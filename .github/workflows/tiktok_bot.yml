name: TikTok Monitor Bot

on:
  schedule:
    # Spustí se každých 30 minut, pondělí až neděle
    - cron: '*/30 * * * *'
  workflow_dispatch: # Umožňuje ruční spuštění tlačítkem

jobs:
  run-tiktok-bot:
    runs-on: ubuntu-latest
    
    # Důležité: Oprávnění pro zápis do repozitáře, aby bot mohl uložit state.json
    permissions:
      contents: write

    steps:
      - name: Stáhnutí kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalace prohlížeče Playwright
        run: |
          playwright install chromium

      - name: Spuštění monitoru
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Automatické uložení state.json zpět do repozitáře
        run: |
          git config --global user.name "TikTok Bot Action"
          git config --global user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizace state.json po kontrole videí" && git push)