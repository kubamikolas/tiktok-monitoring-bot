name: TikTok Monitor Bot

on:
  schedule:
    # Spustí se každou hodinu, pondělí až neděle
    - cron: '0 * * * *'
  workflow_dispatch: # Umožňuje ruční spuštění tlačítkem na GitHubu

jobs:
  run-tiktok-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnutí kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalace prohlížeče Playwright
        run: |
          playwright install chromium

      - name: Spuštění monitoru
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py